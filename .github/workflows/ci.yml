name: Validate Ork
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ui
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55431
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-validation-placeholder
          SUPABASE_SERVICE_ROLE_KEY: local-validation-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3001
      - run: npm run type-check
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.104.0
      - run: npm run test:db
      - if: always()
        run: supabase stop
